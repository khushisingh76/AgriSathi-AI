
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crop Detection | AgriSathi AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<nav class="navbar">
    <a href="/" class="logo">🌱 AgriSathi<span> AI</span></a>

    <div class="nav-links">
        <a href="/">Home</a>
        <a href="/prediction">Crop Detection</a>
    </div>
</nav>

<div class="upload-container">

    <div class="eyebrow">AI CROP ANALYSIS</div>

    <h1 class="section-title">Crop Disease Detection</h1>

    <p class="section-description">
        Upload a clear image of a crop leaf to analyze it
        using the AgriSathi AI detection model.
    </p>

    <form action="/predict" method="POST" enctype="multipart/form-data">

        <div class="upload-box">
            <div style="font-size: 45px;">🌿</div>

            <h3>Upload Your Leaf Image</h3>

            <p style="color: #bde7bd; margin-top: 10px;">
                Select a JPG, JPEG or PNG image
            </p>

            <input type="file"
                   name="image"
                   accept=".jpg,.jpeg,.png"
                   required>
        </div>

        <button type="submit" class="btn">
            Analyze Crop Image →
        </button>

    </form>

    <a href="/" style="display:inline-block; margin-top:25px; color:white; font-size:20px;">
        ← Back to Home
    </a>

</div>

<footer class="footer">
    © 2026 AgriSathi AI
</footer>

</body>
</html>
